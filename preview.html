<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SongViewer – iPad preview</title>
<style>
  :root { --bg:#1b1b1d; --bar:#262628; --btn:#3a3a3c; --fg:#f2f2f2; --muted:#9a9aa0; --accent:#0a84ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif; overflow:hidden; }
  #bar { height:52px; display:flex; align-items:center; gap:10px; padding:0 14px; background:var(--bar); border-bottom:1px solid #000; }
  #bar .title { font-weight:700; margin-right:6px; white-space:nowrap; }
  #bar .spacer { flex:1; }
  #info { color:var(--muted); font-size:13px; white-space:nowrap; }
  select, button { font:inherit; font-size:14px; color:var(--fg); background:var(--btn); border:0; border-radius:8px; padding:7px 11px; }
  button:hover, select:hover { filter:brightness(1.2); }
  button.primary { background:var(--accent); }
  #stage { position:absolute; top:52px; left:0; right:0; bottom:30px; display:flex; align-items:center; justify-content:center; }
  #scaler { transform-origin:center center; }
  #device { background:#050505; border:14px solid #0b0b0c; border-radius:46px; box-shadow:0 0 0 2px #3a3a3e, 0 24px 60px rgba(0,0,0,.65); overflow:hidden; position:relative; }
  #device iframe { display:block; border:0; background:#000; border-radius:30px; }
  #hint { position:absolute; left:0; right:0; bottom:0; height:30px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<div id="bar">
  <span class="title">SongViewer</span>
  <select id="dev" title="Device size"></select>
  <button id="rot" title="Rotate">⟲ Rotate</button>
  <select id="scale" title="Preview size">
    <option value="fit">Fit window</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option>
  </select>
  <span id="info"></span>
  <span class="spacer"></span>
  <button id="reload" title="Reload the app inside the frame">Reload</button>
  <button id="full" title="Use the app in the whole window instead">Full window</button>
</div>
<div id="stage"><div id="scaler"><div id="device"><iframe id="app" title="SongViewer"></iframe></div></div></div>
<div id="hint">Drag song files or a folder onto the iPad · Library ▸ Backup ▸ Export to make the file your iPad imports</div>

<script>
'use strict';
const DEVICES = [
  { id: 'ipad11',  name: 'iPad 11″ / Air',     w: 834,  h: 1194 },
  { id: 'ipad13',  name: 'iPad Pro 13″',       w: 1032, h: 1376 },
  { id: 'ipad129', name: 'iPad Pro 12.9″',     w: 1024, h: 1366 },
  { id: 'ipad102', name: 'iPad 10.2″',         w: 810,  h: 1080 },
  { id: 'ipadmini',name: 'iPad mini',          w: 744,  h: 1133 }
];
const $ = id => document.getElementById(id);
const get = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// Only meaningful on a computer; phones and iPads just open the app itself.
const hosted = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.host);   // inside the ChordClean Mac app
const desktop = hosted || (matchMedia('(pointer:fine) and (hover:hover)').matches && innerWidth >= 900);
window.svHostCall = (fn, arg) => $('app').contentWindow.svHost[fn](arg);
if (!desktop) location.replace('index.html?full=1');

set('sv.frame', 'on');                                   // opening this page means: use the iPad frame
let dev = DEVICES.find(d => d.id === get('sv.frameDev', 'ipad11')) || DEVICES[0];
let land = get('sv.frameRot', 'p') === 'l';
let scaleMode = get('sv.frameScale', 'fit');

DEVICES.forEach(d => $('dev').add(new Option(d.name, d.id)));
$('dev').value = dev.id; $('scale').value = scaleMode;

function layout() {
  const W = land ? dev.h : dev.w, H = land ? dev.w : dev.h, bezel = 14;
  const iframe = $('app');
  iframe.style.width = W + 'px'; iframe.style.height = H + 'px';
  const outerW = W + bezel * 2, outerH = H + bezel * 2;
  const stage = $('stage').getBoundingClientRect();
  let s = scaleMode === 'fit' ? Math.min((stage.width - 40) / outerW, (stage.height - 24) / outerH, 1) : Math.min(+scaleMode, 1.5);
  s = Math.max(0.2, s);
  const sc = $('scaler');
  sc.style.width = outerW + 'px'; sc.style.height = outerH + 'px';
  sc.style.transform = 'scale(' + s + ')';
  // scaled boxes keep their layout size, so pull the stage in by the difference
  sc.style.margin = (-(outerH * (1 - s)) / 2) + 'px ' + (-(outerW * (1 - s)) / 2) + 'px';
  $('info').textContent = dev.name + ' · ' + W + ' × ' + H + ' pt · ' + Math.round(s * 100) + '%';
}
function load() { $('app').src = 'index.html?embedded=1'; }
$('app').addEventListener('load', () => { try { $('app').contentWindow.focus(); } catch (e) {} });

$('dev').onchange = () => { dev = DEVICES.find(d => d.id === $('dev').value); set('sv.frameDev', dev.id); layout(); };
$('rot').onclick = () => { land = !land; set('sv.frameRot', land ? 'l' : 'p'); layout(); };
$('scale').onchange = () => { scaleMode = $('scale').value; set('sv.frameScale', scaleMode); layout(); };
$('reload').onclick = () => $('app').contentWindow.location.reload();
$('full').onclick = () => { set('sv.frame', 'off'); location.href = 'index.html?full=1'; };
addEventListener('resize', layout);

if (desktop) { layout(); load(); }
</script>
</body>
</html>
